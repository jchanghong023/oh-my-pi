# Cargo environment for the workspace.
#
# Native CMake builds use Ninja: Xcode's GNU make 3.81 can block while reading
# cargo's forwarded jobserver pipe. CI images and the Nix dev shell include
# Ninja; macOS dev hosts need `brew install ninja`.
[env]
CMAKE_GENERATOR = "Ninja"
# Permit Knowledge's resource-bounded mmap requests on supported x64 hosts.
# This raises only the ceiling; SQLite's default mapping remains disabled.
LIBSQLITE3_FLAGS = "-DSQLITE_MAX_MMAP_SIZE=68719476736LL"
# Tree-sitter links wasmtime-c-api statically; its headers otherwise declare
# dllimport on MSVC, producing invalid indirect calls in Windows WASM parsing.
# Dependency headers contain UTF-8 comments; MSVC's locale code page can swallow
# their line endings and turn valid NumKong declarations into syntax errors.
CFLAGS_x86_64_pc_windows_msvc = "-DLIBWASM_STATIC /utf-8"
CXXFLAGS_x86_64_pc_windows_msvc = "/utf-8"
# Store each crate's metadata only in its .rmeta instead of duplicating it into
# every rlib. Measured on a reqwest-sized graph: 196 MB -> 130 MB target dir at
# identical build times. Requires the pinned nightly (rust-toolchain.toml).
# The accepted spelling is toolchain-coupled: this nightly accepts a bare
# boolean, while older nightlies took `"DoNotEmbed"`.
[unstable]
embed-metadata = false
