name: "Restore Bazel build cache"
description: >
   Restores GitHub-hosted Bazel action and dependency caches and emits a
   bazelrc fragment using them. No external cache server or credentials required.

inputs:
   scope:
      description: Native target identifier, isolating each matrix leg's cache
      required: true

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}
   cache-key:
      description: Primary key to save after a successful build
      value: ${{ steps.restore.outputs.cache-primary-key }}
   save-needed:
      description: Whether this build needs to save a new cache entry
      value: ${{ steps.restore.outputs.cache-hit != 'true' }}

runs:
   using: composite
   steps:
      - name: Restore Bazel action and dependency caches
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
           CACHE_PREFIX: omp-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ hashFiles('.bazelversion', '.bazelrc', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'BUILD.bazel', 'bazel/**') }}
        with:
           path: |
              ~/.cache/omp-bazel-disk
              ~/.cache/omp-bazel-repo
              ~/.cargo/registry
              ~/.cargo/git
           key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('crates/**') }}
           restore-keys: |
              ${{ env.CACHE_PREFIX }}-

      - name: Compose cache config
        id: compose
        shell: bash
        run: |
           set -euo pipefail
           rc="$RUNNER_TEMP/bazel-cache.rc"
           {
             echo "common --config=ci"
             echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
             echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
             echo "common --repo_env=OMP_XWIN_CACHE_DIR=$HOME/.cache/omp-bazel-repo/xwin"
           } > "$rc"
           echo "rc=$rc" >> "$GITHUB_OUTPUT"
