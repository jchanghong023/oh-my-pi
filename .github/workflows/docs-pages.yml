name: Deploy documentation to GitHub Pages

# Documentation build/deploy is isolated from the application CI.
on:
  push:
    branches: [main]
    paths:
      - 'docs-zh-CN/**'
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install documentation dependencies
        working-directory: docs-zh-CN
        run: npm ci

      - name: Build documentation
        working-directory: docs-zh-CN
        run: npm run docs:build

      - name: Install English documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Build English documentation
        working-directory: docs
        run: npm run docs:build

      - name: Merge English site into Chinese site output
        run: |
          mkdir -p dist/en
          cp -r docs-zh-CN/.vitepress/dist/. dist/
          cp -r docs/.vitepress/dist/. dist/en/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
