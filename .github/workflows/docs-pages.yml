name: Deploy documentation to GitHub Pages

# Documentation build/deploy is isolated from the application CI.
on:
  push:
    branches: [main]
    paths:
      - 'docs-zh-CN/**'
      - 'packages/collab-web/**'
      - 'packages/wire/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # VitePress lastUpdated needs each page's actual commit history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install documentation dependencies
        working-directory: docs-zh-CN
        run: npm ci

      - name: Build documentation
        working-directory: docs-zh-CN
        run: npm run docs:build

      # The fork's browser client (slash-command completion, `/move` directory
      # picker, full command execution) is not in the relay-hosted upstream
      # build, so it ships with the docs site and `collab.webUrl` points here.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build collab web client
        working-directory: packages/collab-web
        run: bun run build:pages

      - name: Stage the collab client into the Pages artifact
        run: |
          mkdir -p docs-zh-CN/.vitepress/dist/collab
          cp -R packages/collab-web/dist/. docs-zh-CN/.vitepress/dist/collab/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-zh-CN/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
