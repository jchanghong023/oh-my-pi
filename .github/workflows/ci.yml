name: CI

on:
   workflow_dispatch:
      inputs:
         publish_release:
            description: "Create a GitHub Release and tag"
            type: boolean
            default: false

concurrency:
   group: "${{ github.workflow }}-${{ github.ref }}"
   queue: max
   cancel-in-progress: false

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
   contents: read

jobs:
   release_metadata:
      name: Resolve fork release metadata
      runs-on: ubuntu-22.04
      outputs:
         is-release: "true"
         release-tag: ${{ steps.detect.outputs.release-tag }}
         version: ${{ steps.detect.outputs.version }}
         release-timestamp: ${{ steps.detect.outputs.release-timestamp }}
         channel: "stable"
      steps:
         - name: Reject release publication outside main
           if: ${{ inputs.publish_release && github.ref != 'refs/heads/main' }}
           env:
              RELEASE_REF: ${{ github.ref }}
           run: |
              echo "::error::Fork releases must be published from refs/heads/main, got $RELEASE_REF"
              exit 1
         - uses: actions/checkout@v4
         - name: Derive version from fork upstream baseline
           id: detect
           shell: bash
           run: |
              set -euo pipefail
              fork_doc="docs-zh-CN/fork.md"
              baseline_section="$(awk '/^## 当前上游基线/{flag=1; next} /^## /{flag=0} flag' "$fork_doc")"
              if [[ -z "$baseline_section" ]]; then
                echo "Missing '当前上游基线' section in $fork_doc" >&2
                exit 1
              fi
              mapfile -t version_lines < <(printf '%s\n' "$baseline_section" | grep -E '^[-*] \*\*版本\*\*')
              if [[ "${#version_lines[@]}" -ne 1 ]]; then
                echo "Expected exactly one '**版本**' entry in '当前上游基线', found ${#version_lines[@]}" >&2
                exit 1
              fi
              baseline_tag="$(printf '%s' "${version_lines[0]}" | sed -nE 's/^[-*] \*\*版本\*\*[：:][[:space:]]*`([^`]+)`.*/\1/p')"
              if [[ -z "$baseline_tag" ]]; then
                baseline_tag="$(printf '%s' "${version_lines[0]}" | sed -nE 's/^[-*] \*\*版本\*\*[：:][[:space:]]*([^[:space:]]+).*/\1/p')"
              fi
              if [[ ! "$baseline_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Current upstream baseline version has unsupported tag: $baseline_tag" >&2
                exit 1
              fi
              version="${baseline_tag#v}+fork.${{ github.run_number }}"
              release_timestamp="$(date -u +%Y-%m-%dT%H:%MZ)"
              {
                echo "release-tag=v$version"
                echo "version=$version"
                echo "release-timestamp=$release_timestamp"
              } >> "$GITHUB_OUTPUT"
              echo "Building fork version $version from upstream baseline $baseline_tag"


   check:
      name: Lint, type check & web build
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              cargo install --locked --version 0.20.2 cargo-deny
              # Hosted runners start with an empty Cargo cache, so populate the
              # registry before cargo-deny's offline check.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build

   # Validate Rust before allowing a fork release.
   rust_validate:
      name: Validate Rust workspace (bazel)
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy, except
         # brush-core (a vendored fork excluded from the Cargo task too).
         # pi-builtins allows every clippy group in its own manifest (ported
         # brush/uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              # The ulimit guard runs in the step that launches the bazel server
              # (limits are per-process and the server persists across steps).
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...
   # Bazel Rust tests, split across two parallel shards so they overlap the
   # native addon builds instead of serializing behind them.
   rust_test:
      name: Rust tests (shard ${{ matrix.shard.name }})
      runs-on: ubuntu-22.04
      strategy:
         fail-fast: false
         matrix:
            shard:
               - { name: builtins-vendor, targets: "//crates/pi-builtins/... //crates/vendor/..." }
               - { name: rest, targets: "//crates/pi-natives/... //crates/pi-shell/... //crates/pi-ast/... //crates/pi-diff/... //crates/pi-edit/... //crates/pi-iso/... //crates/pi-vcs/... //crates/pi-voice/... //crates/pi-walker/..." }
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test ${{ matrix.shard.targets }}

   # Build every native addon needed by the non-macOS binaries and TS tests,
   # one runner per target triple, then gather the pieces back into the single
   # artifact layout consumed by native-artifacts / scripts/bazel-natives.ts.
   native_addon_build:
      name: Build native addon ${{ matrix.target_id }}
      runs-on: ubuntu-22.04
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target_id: linux-arm64, target: natives-linux-arm64, save_cache: false }
               - { target_id: linux-musl-arm64, target: natives-linux-musl-arm64, save_cache: false }
               - { target_id: linux-musl-x64-baseline, target: natives-linux-musl-x64-baseline, save_cache: false }
               - { target_id: linux-x64-baseline, target: natives-linux-x64-baseline, save_cache: true }
               - { target_id: linux-x64-modern, target: natives-linux-x64-modern, save_cache: false }
               - { target_id: win32-x64-baseline, target: natives-win32-x64-baseline, save_cache: false }
      steps:
         - uses: actions/checkout@v4

         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build native addon
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:${{ matrix.target }}" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"
         # Cache-hit visibility: a supposedly warm build that executes
         # thousands of actions is the failure mode that made CI slow — make
         # it visible in the run summary instead of discovering it weeks in.
         - name: Report bazel cache stats
           shell: bash
           run: |
              # Bazel runs with --color=yes (config=ci); strip ANSI before
              # matching — escapes split "INFO:" from the process count in
              # the raw log.
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"

         # Only the linux-x64-baseline leg saves the disk cache: concurrent
         # actions/cache saves of the same key fail (key already exists).
         # Every leg restores the shared archive; content addressing keeps it
         # complete even though each leg contributes different blobs.
         - name: Save bazel disk cache
           if: steps.cache.outputs.save-needed == 'true' && matrix.save_cache
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              # Must mirror the restore path list in the bazel-cache action.
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.cache.outputs.cache-key }}

         # Stage outputs underneath a natives-<target> directory so this
         # artifact keeps the same internal layout as the upstream
         # bazel-bin/natives-*/*.node upload: a glob like
         # bazel-bin/<target>/*.node would flatten the directory away.
         - name: Upload native addon artifact
           run: |
              set -eo pipefail
              mkdir -p "addon-staging/natives-${{ matrix.target_id }}"
              cp bazel-bin/${{ matrix.target }}/*.node "addon-staging/natives-${{ matrix.target_id }}/"
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons-${{ matrix.target_id }}
              path: addon-staging/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   # Gather the per-triple artifacts back into the single native-addons
   # artifact consumed by native-artifacts and the release_binary jobs.
   native_addons:
      name: Gather native addons
      needs: [native_addon_build]
      if: ${{ !cancelled() && needs.native_addon_build.result == 'success' }}
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: native-addons-*
              path: tmp-gather
              merge-multiple: true
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: tmp-gather/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   test_workspace:
      name: Test TS workspace fast
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              # Not `test:scripts`: scripts/musl-release.test.ts fails on main
              # (its install.sh smoke-check executes a fake binary), so running
              # the whole group here would red this job on an unrelated break.
              bun test scripts/ci-test-ts.test.ts scripts/release.test.ts

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_coding_agent_native:
      name: Test coding-agent native/unit (TS)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent native/unit bucket
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: xvfb-run -a bun run ci:test:coding-agent:native

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods

   # Publishing waits for every validation job; binary builds overlap the tests.
   release_gate:
      name: Release validation gate
      if: ${{ !cancelled() &&
         needs.release_metadata.result == 'success' &&
         needs.rust_validate.result == 'success' &&
         needs.rust_test.result == 'success' &&
         needs.native_addons.result == 'success' &&
         needs.test_workspace.result == 'success' &&
         needs.test_coding_agent_singleton.result == 'success' &&
         needs.test_ts_native.result == 'success' &&
         needs.test_coding_agent_ui.result == 'success' &&
         needs.test_coding_agent_runtime.result == 'success' &&
         needs.test_coding_agent_native.result == 'success' &&
         needs.test_smoke.result == 'success' && needs.check.result == 'success' &&
         needs.install_methods.result == 'success' }}
      needs: [release_metadata, check, rust_validate, rust_test, native_addons, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # A stale generated clippy config blocks fork artifacts and releases.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - run: echo "release validation green"

   # Build every non-macOS target. Each artifact remains downloadable even when
   # publish_release is false.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ !cancelled() &&
         needs.release_metadata.result == 'success' &&
         needs.native_addons.result == 'success' }}
      needs: [release_metadata, native_addons]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    libc: musl,
                    arch: arm64,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/omp-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
              RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
              RELEASE_TIMESTAMP: ${{ needs.release_metadata.outputs.release-timestamp }}
              UPDATE_REPOSITORY: ${{ github.repository }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           run: |
              runtime_dir="$(mktemp -d)"
              version_output="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version)"
              test "$version_output" = "omp/${{ needs.release_metadata.outputs.version }} (built ${{ needs.release_metadata.outputs.release-timestamp }})"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/omp:ro" \
                -e EXPECTED_VERSION="${{ needs.release_metadata.outputs.version }}" -e EXPECTED_TIMESTAMP="${{ needs.release_metadata.outputs.release-timestamp }}" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                version_output="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version)"
                test "$version_output" = "omp/$EXPECTED_VERSION (built $EXPECTED_TIMESTAMP)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   release_github:
      name: Publish GitHub release
      if: ${{ inputs.publish_release &&
         github.ref == 'refs/heads/main' &&
         !cancelled() &&
         needs.release_metadata.result == 'success' &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_gate, release_binary]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/omp-* \
                packages/browser-relay/dist/omp-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              target_commitish: ${{ github.sha }}
              prerelease: false
              files: |
                 packages/coding-agent/binaries/omp-*
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              generate_release_notes: true

