name: CI
run-name: CI
on:
   workflow_dispatch:
      inputs:
         publish_release:
            description: "Create a GitHub Release and tag"
            type: boolean
            default: false

concurrency:
   group: "${{ github.workflow }}-${{ github.ref }}"
   queue: max
   cancel-in-progress: false

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
   contents: read

jobs:
   release_metadata:
      name: Resolve fork release metadata
      runs-on: ubuntu-22.04
      outputs:
         is-release: "true"
         release-tag: ${{ steps.detect.outputs.release-tag }}
         version: ${{ steps.detect.outputs.version }}
         channel: "stable"
      steps:
         - name: Reject release publication outside main
           if: ${{ inputs.publish_release && github.ref != 'refs/heads/main' }}
           env:
              RELEASE_REF: ${{ github.ref }}
           run: |
              echo "::error::Fork releases must be published from refs/heads/main, got $RELEASE_REF"
              exit 1
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         - name: Derive version from fork upstream baseline
           id: detect
           shell: bash
           run: |
              set -euo pipefail
              fork_doc="openspec/specs/fork-upstream-baseline/spec.md"
              baseline_section="$(awk '/^## 当前上游基线/{flag=1; next} /^## /{flag=0} flag' "$fork_doc")"
              if [[ -z "$baseline_section" ]]; then
                echo "Missing '当前上游基线' section in $fork_doc" >&2
                exit 1
              fi
              mapfile -t version_lines < <(printf '%s\n' "$baseline_section" | grep -E '^[-*] \*\*版本\*\*')
              if [[ "${#version_lines[@]}" -ne 1 ]]; then
                echo "Expected exactly one '**版本**' entry in '当前上游基线', found ${#version_lines[@]}" >&2
                exit 1
              fi
              baseline_tag="$(printf '%s' "${version_lines[0]}" | sed -nE 's/^[-*] \*\*版本\*\*[：:][[:space:]]*`([^`]+)`.*/\1/p')"
              if [[ -z "$baseline_tag" ]]; then
                baseline_tag="$(printf '%s' "${version_lines[0]}" | sed -nE 's/^[-*] \*\*版本\*\*[：:][[:space:]]*([^[:space:]]+).*/\1/p')"
              fi
              if [[ ! "$baseline_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Current upstream baseline version has unsupported tag: $baseline_tag" >&2
                exit 1
              fi
              version="${baseline_tag#v}+fork.${{ github.run_number }}"
              {
                echo "release-tag=v$version"
                echo "version=$version"
              } >> "$GITHUB_OUTPUT"
              echo "Building fork version $version from upstream baseline $baseline_tag"

   # Build on each target host with the same Cargo native and binary entrypoints as CNB.
   # Artifacts remain downloadable when publish_release is false.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ !cancelled() && needs.release_metadata.result == 'success' }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    target_id: linux-x64,
                    runner: ubuntu-22.04,
                    rust_target: x86_64-unknown-linux-gnu,
                    native_variant: baseline-glibc2.17,
                    binary_name: omp-linux-x64,
                 }
               - {
                    target_id: win32-x64,
                    runner: windows-2022,
                    rust_target: x86_64-pc-windows-msvc,
                    native_variant: modern-avx2,
                    binary_name: omp-windows-x64.exe,
                 }
      runs-on: ${{ matrix.runner }}
      permissions:
         contents: read
      defaults:
         run:
            shell: bash
      env:
         CARGO_TARGET_DIR: ${{ runner.temp }}/omp-release-cargo-target
         OMP_RELEASE_NATIVE_DIR: ${{ runner.temp }}/omp-release-native
         OMP_RELEASE_BINARY_DIR: ${{ runner.temp }}/omp-release-binaries
         OMP_BUILD_CACHE_DIR: ${{ runner.temp }}/omp-release-build-assets
         RELEASE_TARGETS: ${{ matrix.target_id }}
         RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
         UPDATE_REPOSITORY: ${{ github.repository }}
         RELEASE_COMMIT: ${{ github.sha }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              submodules: recursive
         - name: Require OpenWiki gitlink checkout
           run: |
              set -euo pipefail
              expected="$(git rev-parse HEAD:vendor/openwiki)"
              actual="$(git -C vendor/openwiki rev-parse HEAD)"
              test "$actual" = "$expected" || { echo "::error::OpenWiki submodule does not match the parent gitlink"; exit 1; }
              test -f vendor/openwiki/src/agent/repository-runner.ts || { echo "::error::OpenWiki submodule is missing"; exit 1; }
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-1.4.4-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: |
                 bun-1.4.4-${{ runner.os }}-
         - name: Restore Cargo and build asset caches
           id: cargo-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: |
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ env.CARGO_TARGET_DIR }}
                 ${{ env.OMP_BUILD_CACHE_DIR }}
              key: cargo-local-strip-symbols-v1-${{ runner.os }}-${{ matrix.native_variant }}-${{ hashFiles('rust-toolchain.toml') }}-bun1.4.4-zigbuild0.24.1-zig0.14.1-${{ github.sha }}
              restore-keys: |
                 cargo-local-strip-symbols-v1-${{ runner.os }}-${{ matrix.native_variant }}-${{ hashFiles('rust-toolchain.toml') }}-bun1.4.4-zigbuild0.24.1-zig0.14.1-
         - name: Install pinned host Rust toolchain
           run: |
              set -euo pipefail
              toolchain="$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel)')"
              rustup toolchain install "$toolchain" --profile minimal --target "${{ matrix.rust_target }}"
              echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
         - name: Install pinned Linux glibc 2.17 cross-linker
           if: runner.os == 'Linux'
           run: |
              set -euo pipefail
              python3 -m pip install --user cargo-zigbuild==0.24.1 ziglang==0.14.1
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
         - run: bun install --frozen-lockfile
         - name: Build one host native addon
           run: bun scripts/build-release-native.ts
         - name: Build release binary
           run: bun scripts/ci-release-build-binaries.ts
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ env.OMP_RELEASE_BINARY_DIR }}/${{ matrix.binary_name }}
              if-no-files-found: error
         # Save only on main, after building. Cargo owns dependency/source freshness;
         # the commit suffix refreshes immutable GitHub caches, not gate or binary results.
         - name: Save Cargo and build asset caches
           if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: |
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ env.CARGO_TARGET_DIR }}
                 ${{ env.OMP_BUILD_CACHE_DIR }}
              key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: ${{ steps.bun-cache.outputs.cache-primary-key }}


   browser_relay:
      name: Build browser relay extension
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - run: bun run --cwd packages/browser-relay build
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-browser-relay-extension
              path: packages/browser-relay/dist/omp-browser-relay-extension.zip
              if-no-files-found: error

   release_github:
      name: Publish GitHub release
      if: ${{ inputs.publish_release &&
         github.ref == 'refs/heads/main' &&
         !cancelled() &&
         needs.release_metadata.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.browser_relay.result == 'success' }}
      needs: [release_metadata, release_binary, browser_relay]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Download browser relay extension
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-browser-relay-extension
              path: packages/browser-relay/dist
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              target_commitish: ${{ github.sha }}
              prerelease: false
              files: |
                 packages/coding-agent/binaries/omp-linux-x64
                 packages/coding-agent/binaries/omp-windows-x64.exe
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
              fail_on_unmatched_files: true
              generate_release_notes: true
