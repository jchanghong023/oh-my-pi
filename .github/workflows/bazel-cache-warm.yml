name: Warm bun store cache

# GitHub-hosted runners cannot use the cluster remote cache and only see
# actions/cache entries created on the default branch. This workflow seeds
# the Bun store entry restored by PR and CI consumers:
#
#   warm_bun (ubuntu-22.04) -> the shared `bun-<os>-<lockhash>` store entry.
#                             PR jobs restore it but never save (per-PR-ref
#                             copies of the ~500 MB store once ate ~9.4 GB of
#                             the 10 GB repo cache quota and evicted every
#                             bazel archive).
#
# Paths mirror the cache-key inputs (bun-install action) — a packages/**
# push cannot change the lockfile, so it does not trigger a warm.

on:
   push:
      branches: [main]
      paths:
         - "crates/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - ".github/**"
   workflow_dispatch:

permissions:
   contents: read

# No cancel-in-progress: a cancelled warm saves nothing, and the first bun
# warm on a cold runner takes long enough that back-to-back lockfile pushes
# would cancel it forever. Superseded queued runs still collapse to the
# newest one, and staleness is harmless — consumers seed via prefix keys.
concurrency:
   group: bazel-cache-warm
   cancel-in-progress: false

jobs:
   # Produces the shared Bun store entry PR jobs restore. bun-install saves
   # only on non-PR events, so this default-branch warm remains available to
   # pull-request consumers without creating per-PR cache copies.
   warm_bun:
      name: Seed bun store cache
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
