name: Fork Release

on:
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate official release base
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      official_tag: ${{ steps.metadata.outputs.official_tag }}
      official_sha: ${{ steps.metadata.outputs.official_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bun-install

      - name: Resolve and verify official release base
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Fork releases must be run from main, not $GITHUB_REF"
            exit 1
          fi

          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected coding-agent version: $version"
            exit 1
          fi
          official_tag="v${version}"
          release_tag="v${version}-fork.${GITHUB_RUN_NUMBER}"

          git remote add official https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags official "refs/tags/${official_tag}:refs/tags/official-${official_tag}"
          official_sha="$(git rev-list -n1 "refs/tags/official-${official_tag}")"
          if ! git merge-base --is-ancestor "$official_sha" "$GITHUB_SHA"; then
            echo "::error::Current main is not based on official release ${official_tag} (${official_sha})"
            exit 1
          fi

          for package in \
            @oh-my-pi/pi-natives-linux-x64 \
            @oh-my-pi/pi-natives-linux-arm64 \
            @oh-my-pi/pi-natives-win32-x64; do
            published="$(npm view "${package}@${version}" version 2>/dev/null || true)"
            if [ "$published" != "$version" ]; then
              echo "::error::Official native package ${package}@${version} is unavailable"
              exit 1
            fi
          done

          {
            echo "version=$version"
            echo "official_tag=$official_tag"
            echo "official_sha=$official_sha"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Official source: ${official_tag} (${official_sha})"
          echo "Fork release: ${release_tag} (${GITHUB_SHA})"

      - name: Install official Linux x64 native artifact for validation
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          native_dir="packages/natives/native"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          rm -f "$native_dir"/*.node

          tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@${VERSION}" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$temp_dir"
          cp "$temp_dir"/package/*.node "$native_dir"/

          for file in \
            pi_natives.linux-x64-baseline.node \
            pi_natives.linux-x64-modern.node; do
            test -s "$native_dir/$file" || {
              echo "::error::Missing official native artifact for validation: $file"
              exit 1
            }
          done

      - name: Run official checks and fork Hub regression
        run: |
          bun run ci:check:full
          bun run collab:web:build
          # Match upstream CI: musl-release.test.ts is intentionally excluded.
          bun test scripts/ci-test-ts.test.ts scripts/release.test.ts
          bun test packages/coding-agent/test/tools/hub-mode.test.ts

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            native_package: "@oh-my-pi/pi-natives-linux-x64"
            native_files: "pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node"
            binary: omp-linux-x64
            smoke: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            native_package: "@oh-my-pi/pi-natives-linux-arm64"
            native_files: "pi_natives.linux-arm64.node"
            binary: omp-linux-arm64
            smoke: true
          - target: win32-x64
            runner: ubuntu-22.04
            native_package: "@oh-my-pi/pi-natives-win32-x64"
            native_files: "pi_natives.win32-x64-baseline.node"
            binary: omp-windows-x64.exe
            smoke: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Install official precompiled native artifact
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NATIVE_PACKAGE: ${{ matrix.native_package }}
          REQUIRED_NATIVE_FILES: ${{ matrix.native_files }}
        shell: bash
        run: |
          set -euo pipefail
          native_dir="packages/natives/native"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          rm -f "$native_dir"/*.node

          tarball="$(npm view "${NATIVE_PACKAGE}@${VERSION}" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$temp_dir"
          cp "$temp_dir"/package/*.node "$native_dir"/

          for file in $REQUIRED_NATIVE_FILES; do
            test -s "$native_dir/$file" || {
              echo "::error::Missing official native artifact: $file"
              exit 1
            }
          done
          find "$native_dir" -maxdepth 1 -name '*.node' -printf '%f\n' | sort

      - name: Build official target
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries

      - name: Verify binary
        env:
          BINARY_NAME: ${{ matrix.binary }}
        shell: bash
        run: test -s "packages/coding-agent/binaries/${BINARY_NAME}"

      - name: Smoke-test Linux binary
        if: matrix.smoke
        env:
          BINARY_NAME: ${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/packages/coding-agent/binaries/${BINARY_NAME}"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --smoke-test

      - name: Upload target binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binary-${{ matrix.target }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish fork release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Download target binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omp-binary-*
          path: dist
          merge-multiple: true

      - name: Verify release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            omp-linux-x64 \
            omp-linux-arm64 \
            omp-windows-x64.exe; do
            test -s "dist/$file" || {
              echo "::error::Missing release asset: $file"
              exit 1
            }
          done

          bun run ci:release:checksums \
            dist/SHA256SUMS.txt \
            dist/omp-linux-x64 \
            dist/omp-linux-arm64 \
            dist/omp-windows-x64.exe
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload combined release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-${{ needs.validate.outputs.version }}-fork-${{ github.run_number }}
          path: |
            dist/omp-linux-x64
            dist/omp-linux-arm64
            dist/omp-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create fork release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing="$(git rev-list -n1 "refs/tags/${RELEASE_TAG}")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${existing}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at the expected commit."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: OMP ${{ needs.validate.outputs.version }} fork build ${{ github.run_number }}
          body: |
            Downstream fork package based on official `${{ needs.validate.outputs.official_tag }}`.

            Linux x64, Linux ARM64, and Windows x64 use the same upstream release targets as the official build. Linux native addons are the official same-version precompiled packages; upstream GNU native targets use a glibc 2.17 portability floor, matching the official CentOS 7-compatible build strategy.

            This fork defaults `hub.mode` to `compact`, exposing parent-side asynchronous job control and supervised long-running processes without peer-agent messaging in the model context. Set `hub.mode` to `full` to restore the upstream Hub surface without rebuilding. The upstream Hub/IRC runtime remains intact. This workflow does not compile Rust.
          files: |
            dist/omp-linux-x64
            dist/omp-linux-arm64
            dist/omp-windows-x64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: false
          make_latest: false
          overwrite_files: true
