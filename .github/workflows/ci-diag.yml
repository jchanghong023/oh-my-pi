name: CI diag

# Temporary diagnostic workflow used to reproduce the browser-suite failures
# observed in run 34796751063 on stock ubuntu-22.04. Dispatch only; deleted
# once the fix lands on main.

on:
   workflow_dispatch:

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   diag:
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Browser inventory
           run: |
              set -x
              command -v google-chrome google-chrome-stable chromium chromium-browser || true
              google-chrome --version || true
              ls -la "$HOME/.omp/puppeteer" 2>/dev/null || true
              ls -la "$HOME/.cache/puppeteer" 2>/dev/null || true
              nproc
              free -m | sed -n '1,2p'
         - name: App launch probe
           run: xvfb-run -a bun run scripts/ci-diag-browser.ts
         - name: Failing chunk (browser attach suite)
           working-directory: packages/coding-agent
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              xvfb-run -a bun test --only-failures \
                test/tools/bash-worktree-rewrite.test.ts \
                test/tools/browser-aria-snapshot.test.ts \
                test/tools/browser-attach.test.ts \
                test/tools/browser-cmux-eval-envelope.test.ts \
                test/tools/browser-cmux-guest-rejection.test.ts \
                test/tools/browser-cmux-kind.test.ts \
                test/tools/browser-cmux-observation.test.ts \
                test/tools/browser-cmux-release-mid-run.test.ts \
                test/tools/browser-cmux-socket.test.ts \
                test/tools/browser-dispose-timeout.test.ts \
                --parallel=1 --timeout=30000
