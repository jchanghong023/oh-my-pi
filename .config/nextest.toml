# nextest runs every test in its own process and schedules them in parallel
# across the whole workspace, so anything that relied on `cargo test`'s
# one-binary-at-a-time execution has to declare that here.
#
# Nextest cannot run doctests; the Rust task runs pi-wiki doctests separately
# using cargo test --doc and records command timing without a JUnit report.

[profile.default]
# Print each failure when it happens and again in the final summary — a run
# that fails early in a long workspace sweep should not need scrollback.
failure-output = "immediate-final"
# Report every failing test in one pass instead of stopping at the first.
fail-fast = false

# Enabled for the active default profile (and profiles inheriting it). The
# runner sets a per-invocation nextest store via --tool-config-file; Cargo's
# build target and profile stay unchanged.
[profile.default.junit]
path = "junit.xml"

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
# No retries: a flaky test is a bug we want to see, not paper over.
retries = 0
slow-timeout = { period = "60s", terminate-after = 4 }

# The deep-chain walk tests build and delete a directory chain as deep as the
# host's path syscalls reach. That saturates the filesystem for as long as they
# run, which pushes tests elsewhere in the workspace past their own latency
# assertions (pi-natives' OAuth callback wake, pi-shell's TERM-trap cleanup).
# Each takes every test thread, so it runs alone.
[[profile.default.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"
