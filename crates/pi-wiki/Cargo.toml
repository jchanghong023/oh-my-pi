[package]
name = "pi-wiki"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
grep-matcher.workspace = true
icu_collator = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }
pi-vfs.workspace = true
pi-walker.workspace = true
regex.workspace = true
rusqlite.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com"] }
