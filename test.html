<script>
(() => {

  try{const content=await file.text();if(input.id==='new-file'){if(newDraft!==draft||!$('#import-status'))return;newDraft.imported=content;newDraft.fileName=file.name;$('#import-status').textContent=file.name+' · 已读取，Next 时检查模板';$('#new-error').hidden=true;}else{const r=requirements.find(item=>item.id===targetId);if(!editable(r))return;if(input.dataset.replace==='true'){delete input.dataset.replace;r.imported=content;r.ready=true;r.revision++;r.updatedAt=Date.now();if(selectedId===targetId)render();toast('业务文档已替换，可直接 Next 检查模板');}else{attachments.set(targetId,{name:file.name,content});if(selectedId===targetId){renderAttachment();updateComposer();focusChat();}}input.value='';}}
  catch{toast('无法读取文件，请重新选择。');}
});
reset();
})();
</script>
</body>
</html>
